<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="es" xml:lang="es" aria-labelledby="phases-mono-es-320-title" aria-describedby="phases-mono-es-320-description" viewBox="0 0 320 4142" width="320" height="4142" style="max-width: none; min-width: 320px; height: auto;" data-vrl-flow="rows">
<title id="phases-mono-es-320-title">Synthetic phase membership topo</title><desc id="phases-mono-es-320-description">Ruta esquematica, sin escala. Lea los elementos en orden. Las cuerdas son longitudes declaradas, no requisitos de equipo.
1. Inicio S1 (Trailhead). Fase: aproximacion.
2. Caminata W1. Distancia a pie: 100m. Fase: aproximacion.
3. Rapel R1. Movimiento: descenso. Cambio vertical: -8m. Tipo de anclaje: desconocido. Cantidad de anclajes: desconocido. Altura fisica: 8m. Fase: barranco. Cuerda declarada: 20m.
4. Peligro H1. Anotacion en limite de ruta: 4. Fase: barranco. Tipo: slippery.
5. Nota N1. Anotacion en limite de ruta: 4. Texto: Phase unspecified for this observation.
6. Nado SW1. Movimiento: nado. Distancia a nado: 12m. Fase: barranco.
7. Caminata W2. Distancia a pie: 50m. Fase: retorno.
8. Caminata W3. Distancia a pie: 5m.
9. Salida E1 (Finish). Fase: retorno.</desc>
