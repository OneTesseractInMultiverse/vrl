<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="en" xml:lang="en" aria-labelledby="elements-soft-title" aria-describedby="elements-soft-description" viewBox="0 0 736 3942" width="736" height="3942" style="max-width: none; min-width: 736px; height: auto;" data-vrl-flow="rows">
<title id="elements-soft-title">Synthetic element inventory topo</title><desc id="elements-soft-description">Schematic route, not to scale. Read elements in order. Rope lengths are supplied declarations, not equipment requirements.
1. Start S1.
2. Walk W1. Walking distance: 40m.
3. Rappel R1. Movement: descent. Vertical change: -18m. Anchor type: bolts. Anchor count: 2. Physical height: 18m. Declared rope: 40m. Station: right.
4. Pool P1. Measured pool depth: unknown. Type: unknown.
5. Downclimb D1. Movement: descent. Vertical change: -3m. Exposure: medium. Physical height: 3m.
6. Climb C1. Movement: ascent. Vertical change: 4m. Exposure: high. Physical height: 5m. Inclination (100% = vertical): 80%.
7. Hazard H1. Annotation at route boundary: 7. Note: Reported hazard; current conditions unknown. Severity: high. Type: snake.
8. Note N1. Annotation at route boundary: 7. Text: Annotation preserves order without adding a physical segment.
9. Exit E1.</desc>
