</g><text x="24" y="3016" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#eef2f5" xml:space="preserve">Lectura de las filas</text><text x="24" y="3048" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Flecha: sentido de </text><text x="24" y="3072" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">progresion. Trazos </text><text x="24" y="3096" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">cortos: limites de </text><text x="24" y="3120" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">etapas. Rombos: </text><text x="24" y="3144" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">desviadores. Trazos </text><text x="24" y="3168" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">dobles: lado de reunion. </text><text x="24" y="3192" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Zigzag: distancia a pie </text><text x="24" y="3216" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">comprimida. El texto </text><text x="24" y="3240" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">conserva los datos y </text><text x="24" y="3264" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">cantidades declarados.</text><text x="56" y="3292" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Inicio del acceso</text><text x="56" y="3320" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Fin del acceso</text><text x="56" y="3348" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Pernos: cantidad en </text><text x="56" y="3372" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">texto</text><text x="56" y="3400" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Anclaje en árbol</text><text x="56" y="3428" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Suelo resbaladizo</text>
