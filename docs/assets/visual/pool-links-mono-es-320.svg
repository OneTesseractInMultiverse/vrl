<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="es" xml:lang="es" aria-labelledby="pool-links-mono-es-320-title" aria-describedby="pool-links-mono-es-320-description" viewBox="0 0 320 4270" width="320" height="4270" style="max-width: none; min-width: 320px; height: auto;" data-vrl-flow="rows">
<title id="pool-links-mono-es-320-title">Synthetic pool associations topo</title><desc id="pool-links-mono-es-320-description">Ruta esquematica, sin escala. Lea los elementos en orden. Las cuerdas son longitudes declaradas, no requisitos de equipo.
1. Inicio S1 (Entry).
2. Poza Upper basin. Profundidad medida de poza: 2m.
3. Nado SW1. Movimiento: nado. Distancia a nado: 12m. Fase: barranco. Referencia de poza: Upper basin.
4. Peligro H1. Anotacion en limite de ruta: 3. Nota: Supplied observation. Tipo: slippery.
5. Nado SW2. Movimiento: nado. Distancia a nado: desconocido. Referencia de poza: Lower basin.
6. Poza Lower basin. Profundidad medida de poza: desconocido.
7. Nado SW3. Movimiento: nado. Distancia a nado: 3m.
8. Caminata W1. Distancia a pie: 5m. Fase: retorno.
9. Salida E1 (Exit).</desc>
