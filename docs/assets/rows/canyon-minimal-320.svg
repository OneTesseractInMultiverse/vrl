<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 320 3454" width="320" height="3454" style="max-width: none; min-width: 320px; height: auto;" data-vrl-flow="rows">
<title>Synthetic two-rappel canyon</title><desc>Tramos esquematicos, de arriba abajo. Las letras emparejadas continuan la misma ruta; los saltos de fila no son eventos. Curvas y distancias a pie no estan a escala.</desc>
<defs><marker id="canyon-minimal-320-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#c3ccd4"/></marker></defs>
<rect x="0" y="0" width="320" height="3454" fill="#14171a"/>
<text x="24" y="44" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#eef2f5" xml:space="preserve">Synthetic two-rappel </text><text x="24" y="72" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#eef2f5" xml:space="preserve">canyon</text><text x="24" y="104" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Esquema sin escala. Lea </text><text x="24" y="128" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">los tramos de arriba </text><text x="24" y="152" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">abajo y siga las letras </text><text x="24" y="176" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">de continuacion.</text><text x="24" y="204" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Dificultad: sin dato</text><text x="24" y="232" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Desnivel: sin dato</text><text x="24" y="260" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Region: sin dato</text><text x="24" y="288" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">Pais: sin dato</text><g class="vrl-row" data-section="1" data-elements="0">
<text x="24" y="360" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#eef2f5" xml:space="preserve">Tramo 1</text><text x="56" y="444" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#eef2f5" xml:space="preserve" data-element="0">Inicio Entry [S1]</text><g class="vrl-continuation" data-code="A" data-role="out" data-section="2"><text x="24" y="508" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">A ↓ Continua al tramo 2</text></g>
