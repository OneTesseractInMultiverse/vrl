<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="en" xml:lang="en" aria-labelledby="pools-light-title" aria-describedby="pools-light-description" viewBox="0 0 320 3250" width="320" height="3250" style="max-width: none; min-width: 320px; height: auto;" data-vrl-flow="rows">
<title id="pools-light-title">Synthetic pool and flow states topo</title><desc id="pools-light-description">Schematic route, not to scale. Read elements in order. Rope lengths are supplied declarations, not equipment requirements.
1. Pool P1. Measured pool depth: unknown. Flow: high. Type: deep.
2. Pool P2. Measured pool depth: unknown. Flow: medium. Type: shallow.
3. Pool P3. Measured pool depth: unknown. Flow: low. Type: swimmer.
4. Pool P4. Measured pool depth: unknown. Flow: dry. Type: dry.
5. Pool P5. Measured pool depth: unknown. Type: unknown.
6. Hazard H1. Annotation at route boundary: 5. Severity: low. Type: slippery.
7. Hazard H2. Annotation at route boundary: 5. Severity: medium. Type: slippery.
8. Hazard H3. Annotation at route boundary: 5. Severity: high. Type: slippery.
9. Hazard H4. Annotation at route boundary: 5. Severity: critical. Type: slippery.</desc>
