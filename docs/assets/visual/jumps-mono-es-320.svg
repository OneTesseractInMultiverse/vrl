<text x="24" y="44" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#111111" xml:space="preserve">Synthetic jumps</text><text x="24" y="76" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Esquema sin escala. Lea </text><text x="24" y="100" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">los tramos de arriba </text><text x="24" y="124" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">abajo y siga las letras </text><text x="24" y="148" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">de continuacion.</text><text x="24" y="176" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Dificultad: sin dato</text><text x="24" y="204" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Desnivel: sin dato</text><text x="24" y="232" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Region: sin dato</text><text x="24" y="260" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Pais: sin dato</text><g class="vrl-row" data-section="1" data-elements="0">
