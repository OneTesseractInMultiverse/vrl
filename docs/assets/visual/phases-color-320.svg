<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="en" xml:lang="en" aria-labelledby="phases-color-320-title" aria-describedby="phases-color-320-description" viewBox="0 0 320 4210" width="320" height="4210" style="max-width: none; min-width: 320px; height: auto;" data-vrl-flow="rows">
<title id="phases-color-320-title">Synthetic phase membership topo</title><desc id="phases-color-320-description">Schematic route, not to scale. Read elements in order. Rope lengths are supplied declarations, not equipment requirements.
1. Start S1 (Trailhead). Phase: approach.
2. Walk W1. Walking distance: 100m. Phase: approach.
3. Rappel R1. Movement: descent. Vertical change: -8m. Anchor type: unknown. Anchor count: unknown. Physical height: 8m. Phase: canyon. Declared rope: 20m.
4. Hazard H1. Annotation at route boundary: 4. Phase: canyon. Type: slippery.
5. Note N1. Annotation at route boundary: 4. Text: Phase unspecified for this observation.
6. Swim SW1. Movement: swimming. Swimming distance: 12m. Phase: canyon.
7. Walk W2. Walking distance: 50m. Phase: return.
8. Walk W3. Walking distance: 5m.
9. Exit E1 (Finish). Phase: return.</desc>
