<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="en" xml:lang="en" aria-labelledby="swim-icons-320-title" aria-describedby="swim-icons-320-description" viewBox="0 0 320 3814" width="320" height="3814" style="max-width: none; min-width: 320px; height: auto;" data-vrl-flow="rows">
<title id="swim-icons-320-title">Synthetic aquatic itinerary topo</title><desc id="swim-icons-320-description">Schematic route, not to scale. Read elements in order. Rope lengths are supplied declarations, not equipment requirements.
1. Start S1.
2. Pool P1. Measured pool depth: 2.5m. Type: deep.
3. Swim SW1. Movement: swimming. Swimming distance: 12m. Flow: low. Note: Supplied example.
4. Hazard H1. Annotation at route boundary: 3. Type: slippery.
5. Rappel R1. Movement: descent. Vertical change: -4m. Anchor type: unknown. Anchor count: unknown. Physical height: 4m. Declared rope: 8m.
6. Walk W1. Walking distance: 6m.
7. Swim SW2. Movement: swimming. Swimming distance: unknown.
8. Exit E1.</desc>
