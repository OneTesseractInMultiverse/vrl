ace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve" data-element="1">Cambio vertical: -18m</text><g class="vrl-continuation" data-code="B" data-role="out" data-section="3"><text x="24" y="1108" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#eef2f5" xml:space="preserve">B ↓ Continua al tramo 3</text></g>
