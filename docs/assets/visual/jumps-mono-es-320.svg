<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="es" xml:lang="es" aria-labelledby="jumps-mono-es-320-title" aria-describedby="jumps-mono-es-320-description" viewBox="0 0 320 3998" width="320" height="3998" style="max-width: none; min-width: 320px; height: auto;" data-vrl-flow="rows">
<title id="jumps-mono-es-320-title">Synthetic jumps topo</title><desc id="jumps-mono-es-320-description">Ruta esquematica, sin escala. Lea los elementos en orden. Las cuerdas son longitudes declaradas, no requisitos de equipo.
1. Inicio S1 (Entry).
2. Salto J1. Movimiento: descenso. Cambio vertical: -3m. Flujo: bajo. Altura fisica: 3m. Llegada: poza. Fase: barranco.
3. Peligro H1. Anotacion en limite de ruta: 3. Nota: Supplied observation. Tipo: slippery.
4. Poza P1. Profundidad medida de poza: 2m.
5. Nado SW1. Movimiento: nado. Distancia a nado: 12m. Referencia de poza: P1.
6. Salto J2. Movimiento: descenso. Cambio vertical: desconocido. Altura fisica: desconocido.
7. Nota N1. Anotacion en limite de ruta: 6. Texto: No landing association inferred..
8. Caminata W1. Distancia a pie: 5m. Fase: retorno.
9. Salida E1 (Exit).</desc>
