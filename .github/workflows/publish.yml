name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag (vX.Y.Z) reachable from main
        required: true
        type: string
      operation:
        description: Validate only, publish, or resume an interrupted publication
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish, resume]

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  OPERATION: ${{ inputs.operation }}

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Require a stable tag and a protected main dispatch
        id: dispatch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REPOSITORY" != OneTesseractInMultiverse/vrl ||
                "$GITHUB_REF" != refs/heads/main || "$GITHUB_REF_PROTECTED" != true ]]; then
            echo "Dispatch Publish from the protected main branch of the release repository." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Enter a stable version tag in vX.Y.Z format." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the tag against the protected main commit
        id: identity
        run: |
          set -euo pipefail
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$commit" "$GITHUB_SHA"
          if [[ "$OPERATION" != dry-run && "$commit" != "$GITHUB_SHA" ]]; then
            echo "Publication requires the tag to match the protected main dispatch SHA recorded in npm provenance." >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  verify:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.10.0"
          package-manager-cache: false
      - run: node scripts/verify-release.mjs
      - run: npm ci
      - run: make check

  consumers:
    needs: [authorize, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            node: "20.0.0"
          - profile: current
            node: "24.21.0"
          - profile: current
            node: "26.10.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node scripts/prepare-consumers.mjs ${{ matrix.profile }}
      - run: node .consumers/${{ matrix.profile }}/node_modules/playwright/cli.js install --with-deps chromium
      - run: node scripts/check-consumers.mjs ${{ matrix.profile }}

  publish:
    needs: [authorize, verify, consumers]
    if: inputs.operation == 'publish' || inputs.operation == 'resume'
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.10.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: node scripts/verify-release.mjs
      # Package sources require no build or install; validation ran without OIDC.
      - name: Publish verified tarballs with npm OIDC
        id: publication
        run: |
          set -euo pipefail
          args=(--release current --provenance --trusted-publisher --skip-check)
          if [[ "$OPERATION" == resume || "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then
            echo "Recovering this release: verify existing tarball integrity before publishing missing packages."
            args+=(--resume)
          fi
          node scripts/publish-workspaces.mjs "${args[@]}"
