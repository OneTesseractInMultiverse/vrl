<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="es" xml:lang="es" aria-labelledby="swim-mono-es-320-title" aria-describedby="swim-mono-es-320-description" viewBox="0 0 320 3910" width="320" height="3910" style="max-width: none; min-width: 320px; height: auto;" data-vrl-flow="rows">
<title id="swim-mono-es-320-title">Synthetic aquatic itinerary topo</title><desc id="swim-mono-es-320-description">Ruta esquematica, sin escala. Lea los elementos en orden. Las cuerdas son longitudes declaradas, no requisitos de equipo.
1. Inicio S1.
2. Poza P1. Profundidad medida de poza: 2.5m. Tipo: profunda.
3. Nado SW1. Movimiento: nado. Distancia a nado: 12m. Flujo: bajo. Nota: Supplied example.
4. Peligro H1. Anotacion en limite de ruta: 3. Tipo: slippery.
5. Rapel R1. Movimiento: descenso. Cambio vertical: -4m. Tipo de anclaje: desconocido. Cantidad de anclajes: desconocido. Altura fisica: 4m. Cuerda declarada: 8m.
6. Aproximacion W1. Distancia a pie: 6m.
7. Nado SW2. Movimiento: nado. Distancia a nado: desconocido.
8. Salida E1.</desc>
