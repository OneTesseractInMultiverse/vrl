icio del acceso</text><text x="56" y="4136" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Fin del acceso</text><text x="56" y="4164" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Pernos: cantidad en </text><text x="56" y="4188" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">texto</text><text x="56" y="4216" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Anclaje en árbol</text><text x="56" y="4244" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Suelo resbaladizo</text>
