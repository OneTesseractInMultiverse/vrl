<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="en" xml:lang="en" aria-labelledby="jumps-color-320-title" aria-describedby="jumps-color-320-description" viewBox="0 0 320 4018" width="320" height="4018" style="max-width: none; min-width: 320px; height: auto;" data-vrl-flow="rows">
<title id="jumps-color-320-title">Synthetic jumps topo</title><desc id="jumps-color-320-description">Schematic route, not to scale. Read elements in order. Rope lengths are supplied declarations, not equipment requirements.
1. Start S1 (Entry).
2. Jump J1. Movement: descent. Vertical change: -3m. Flow: low. Physical height: 3m. Landing: pool. Phase: canyon.
3. Hazard H1. Annotation at route boundary: 3. Note: Supplied observation. Type: slippery.
4. Pool P1. Measured pool depth: 2m.
5. Swim SW1. Movement: swimming. Swimming distance: 12m. Pool reference: P1.
6. Jump J2. Movement: descent. Vertical change: unknown. Physical height: unknown.
7. Note N1. Annotation at route boundary: 6. Text: No landing association inferred..
8. Walk W1. Walking distance: 5m. Phase: return.
9. Exit E1 (Exit).</desc>
