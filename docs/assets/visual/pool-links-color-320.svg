<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="en" xml:lang="en" aria-labelledby="pool-links-color-320-title" aria-describedby="pool-links-color-320-description" viewBox="0 0 320 4338" width="320" height="4338" style="max-width: none; min-width: 320px; height: auto;" data-vrl-flow="rows">
<title id="pool-links-color-320-title">Synthetic pool associations topo</title><desc id="pool-links-color-320-description">Schematic route, not to scale. Read elements in order. Rope lengths are supplied declarations, not equipment requirements.
1. Start S1 (Entry).
2. Pool Upper basin. Measured pool depth: 2m.
3. Swim SW1. Movement: swimming. Swimming distance: 12m. Phase: canyon. Pool reference: Upper basin.
4. Hazard H1. Annotation at route boundary: 3. Note: Supplied observation. Type: slippery.
5. Swim SW2. Movement: swimming. Swimming distance: unknown. Pool reference: Lower basin.
6. Pool Lower basin. Measured pool depth: unknown.
7. Swim SW3. Movement: swimming. Swimming distance: 3m.
8. Walk W1. Walking distance: 5m. Phase: return.
9. Exit E1 (Exit).</desc>
