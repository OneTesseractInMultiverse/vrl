version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  # These lockfiles certify particular framework versions. Security updates
  # remain eligible; routine version changes belong to compatibility work.
  - package-ecosystem: npm
    directories:
      - /integration/profiles/minimum
      - /integration/profiles/current
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
