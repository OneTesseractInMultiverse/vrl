</g><text x="24" y="3536" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#111111" xml:space="preserve">Lectura de las filas</text><text x="24" y="3568" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Flecha: sentido de </text><text x="24" y="3592" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">progresion. Trazos </text><text x="24" y="3616" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">cortos: limites de </text><text x="24" y="3640" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">etapas. Rombos: </text><text x="24" y="3664" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">desviadores. Trazos </text><text x="24" y="3688" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">dobles: lado de reunion. </text><text x="24" y="3712" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Zigzag: distancia a </text><text x="24" y="3736" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">pie/a nado comprimida. </text><text x="24" y="3760" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">El texto conserva los </text><text x="24" y="3784" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">datos y cantidades </text><text x="24" y="3808" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">declarados.</text><text x="56" y="3836" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Inicio del acceso</text><text x="56" y="3864" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Fin del acceso</text><text x="56" y="3892" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Pernos: cantidad en </text><text x="56" y="3916" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">texto</text><text x="56" y="3944" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Anclaje en árbol</text><text x="56" y="3972" font-family="ui-monospace, monospace" font-size="14" font-weight="400" fill="#111111" xml:space="preserve">Suelo resbaladizo</text>
