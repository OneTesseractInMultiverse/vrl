<svg xmlns="http://www.w3.org/2000/svg" role="img" lang="en" xml:lang="en" aria-labelledby="vrl-title" aria-describedby="vrl-description" viewBox="-14 -99 1171 813" width="1171" height="813" style="max-width: 100%; height: auto;">
  <title id="vrl-title">Synthetic two-rappel canyon topo</title>
  <desc id="vrl-description">Schematic route, not to scale. Read elements in order. Rope lengths are supplied declarations, not equipment requirements.
1. Start S1 (Entry).
2. Rappel R1. Movement: descent. Vertical change: -18m. Anchor type: bolts. Anchor count: 2. Physical height: 18m. Declared rope: 40m. Station: right.
3. Pool P1. Measured pool depth: unknown. Type: unknown.
4. Walk W1. Walking distance: 120m.
5. Rappel R2. Movement: descent. Vertical change: -12m. Anchor type: tree. Anchor count: unknown. Physical height: 12m. Declared rope: 30m.
6. Hazard H1. Annotation at route boundary: 6. Note: Slippery landing. Type: slippery.
7. Exit E1 (Exit).</desc>
